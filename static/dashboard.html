<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>rgb-hub dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0f; color: #e0e0e0; font-family: 'Segoe UI', system-ui, sans-serif; height: 100vh; overflow: hidden; }

  .grid { display: grid; grid-template-columns: 1fr 320px; grid-template-rows: auto 1fr; height: 100vh; gap: 0; }

  header { grid-column: 1 / -1; padding: 16px 24px; background: #111118; border-bottom: 1px solid #222; display: flex; align-items: center; gap: 16px; }
  header h1 { font-size: 20px; font-weight: 600; color: #fff; }
  header .status { font-size: 13px; color: #888; }
  header .status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  header .status .dot.on { background: #4caf50; box-shadow: 0 0 6px #4caf50; }
  header .status .dot.off { background: #555; }

  .main { padding: 20px 24px; overflow-y: auto; }

  /* light preview */
  .light-section { margin-bottom: 24px; }
  .light-section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: #666; margin-bottom: 12px; }
  .lights { display: flex; gap: 16px; flex-wrap: wrap; }
  .light-card { background: #16161e; border-radius: 12px; padding: 20px; flex: 1; min-width: 200px; border: 1px solid #222; }
  .light-card .name { font-size: 14px; font-weight: 600; color: #aaa; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
  .light-preview { width: 100%; height: 80px; border-radius: 8px; transition: background-color 0.3s ease; display: flex; align-items: center; justify-content: center; font-size: 13px; color: rgba(255,255,255,0.7); font-weight: 500; }
  .light-card .meta { margin-top: 8px; font-size: 12px; color: #666; }

  /* log */
  .log-section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: #666; margin-bottom: 12px; }
  .log { background: #111118; border-radius: 8px; border: 1px solid #1a1a24; overflow: hidden; }
  .log-entry { padding: 10px 14px; border-bottom: 1px solid #1a1a24; font-family: 'Cascadia Code', 'Fira Code', monospace; font-size: 13px; display: flex; gap: 10px; align-items: flex-start; animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
  .log-entry:last-child { border-bottom: none; }
  .log-entry .time { color: #555; white-space: nowrap; min-width: 70px; }
  .log-entry .method { font-weight: 700; min-width: 44px; }
  .log-entry .method.POST { color: #4caf50; }
  .log-entry .method.GET { color: #42a5f5; }
  .log-entry .path { color: #ccc; }
  .log-entry .status-code { margin-left: auto; font-weight: 600; }
  .log-entry .status-code.ok { color: #4caf50; }
  .log-entry .status-code.err { color: #ef5350; }
  .log-entry .detail { color: #777; font-size: 12px; margin-top: 2px; grid-column: 2 / -1; }

  /* sidebar */
  .sidebar { background: #111118; border-left: 1px solid #222; padding: 20px; overflow-y: auto; }
  .sidebar h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: #666; margin-bottom: 12px; }
  .stat { background: #16161e; border-radius: 8px; padding: 14px; margin-bottom: 10px; border: 1px solid #1a1a24; }
  .stat .label { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; }
  .stat .value { font-size: 22px; font-weight: 700; color: #fff; margin-top: 4px; }
  .stat .value.accent { color: #4caf50; }

  .mode-badge { display: inline-block; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: 600; text-transform: uppercase; }
  .mode-badge.screen { background: #1a237e; color: #7986cb; }
  .mode-badge.audio { background: #1b5e20; color: #81c784; }
  .mode-badge.off { background: #333; color: #888; }

  .color-swatch { width: 100%; height: 60px; border-radius: 8px; margin-top: 8px; border: 1px solid #333; }
</style>
</head>
<body>
<div class="grid">
  <header>
    <h1>rgb-hub</h1>
    <div class="status">
      <span class="dot off" id="statusDot"></span>
      <span id="statusText">conectando...</span>
    </div>
  </header>

  <div class="main">
    <div class="light-section">
      <h2>Luzes</h2>
      <div class="lights" id="lights">
        <div class="light-card">
          <div class="name">fita</div>
          <div class="light-preview" id="preview-fita" style="background:#333;">aguardando...</div>
          <div class="meta" id="meta-fita">--</div>
        </div>
        <div class="light-card">
          <div class="name">quarto</div>
          <div class="light-preview" id="preview-quarto" style="background:#333;">aguardando...</div>
          <div class="meta" id="meta-quarto">--</div>
        </div>
      </div>
    </div>

    <div class="log-section">
      <h2>Requisicoes em tempo real</h2>
      <div class="log" id="log">
        <div class="log-entry">
          <span class="time">--:--:--</span>
          <span class="detail" style="color:#555;">aguardando primeira requisicao...</span>
        </div>
      </div>
    </div>
  </div>

  <div class="sidebar">
    <h2>Status</h2>
    <div class="stat">
      <div class="label">Modo</div>
      <div class="value" id="currentMode"><span class="mode-badge off">parado</span></div>
    </div>
    <div class="stat">
      <div class="label">Requisicoes</div>
      <div class="value accent" id="requestCount">0</div>
    </div>
    <div class="stat">
      <div class="label">Ultima cor</div>
      <div class="color-swatch" id="lastColor" style="background:#222;"></div>
    </div>
    <div class="stat">
      <div class="label">Uptime</div>
      <div class="value" id="uptime">0s</div>
    </div>
  </div>
</div>

<script>
  const logEl = document.getElementById('log');
  const countEl = document.getElementById('requestCount');
  const modeEl = document.getElementById('currentMode');
  const colorEl = document.getElementById('lastColor');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const uptimeEl = document.getElementById('uptime');
  let requestCount = 0;
  let startTime = Date.now();

  function updateUptime() {
    const s = Math.floor((Date.now() - startTime) / 1000);
    const m = Math.floor(s / 60);
    const h = Math.floor(m / 60);
    uptimeEl.textContent = h > 0 ? `${h}h ${m % 60}m` : m > 0 ? `${m}m ${s % 60}s` : `${s}s`;
  }
  setInterval(updateUptime, 1000);

  function hexToRgb(hex) {
    hex = hex.replace('#', '');
    if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
    const r = parseInt(hex.substr(0, 2), 16);
    const g = parseInt(hex.substr(2, 2), 16);
    const b = parseInt(hex.substr(4, 2), 16);
    return `rgb(${r},${g},${b})`;
  }

  function addLog(method, path, status, detail) {
    const now = new Date();
    const time = now.toTimeString().substr(0, 8);
    const entry = document.createElement('div');
    entry.className = 'log-entry';
    const statusClass = status < 400 ? 'ok' : 'err';
    entry.innerHTML = `
      <span class="time">${time}</span>
      <span class="method ${method}">${method}</span>
      <span class="path">${path}</span>
      <span class="status-code ${statusClass}">${status}</span>
      ${detail ? `<span class="detail">${detail}</span>` : ''}
    `;
    logEl.prepend(entry);
    if (logEl.children.length > 50) logEl.lastChild.remove();
    requestCount++;
    countEl.textContent = requestCount;
  }

  function updateLight(name, hex, brightness) {
    const preview = document.getElementById(`preview-${name}`);
    const meta = document.getElementById(`meta-${name}`);
    if (preview) {
      preview.style.background = hexToRgb(hex);
      preview.textContent = hex;
      preview.style.color = brightness > 50 ? '#000' : '#fff';
    }
    if (meta) meta.textContent = `brilho: ${brightness}%`;
    colorEl.style.background = hexToRgb(hex);
  }

  function setMode(mode) {
    const badges = {
      screen: '<span class="mode-badge screen">tela</span>',
      audio: '<span class="mode-badge audio">audio</span>',
      off: '<span class="mode-badge off">parado</span>',
    };
    modeEl.innerHTML = badges[mode] || badges.off;
    statusDot.className = mode === 'off' ? 'dot off' : 'dot on';
    statusText.textContent = mode === 'off' ? 'parado' : `sync ${mode}`;
  }

  // SSE connection
  function connectSSE() {
    const es = new EventSource('/dashboard/events');
    es.onmessage = (e) => {
      const data = JSON.parse(e.data);
      if (data.type === 'request') {
        addLog(data.method, data.path, data.status, data.detail);
      } else if (data.type === 'light') {
        updateLight(data.name, data.hex, data.brightness);
      } else if (data.type === 'mode') {
        setMode(data.mode);
      }
    };
    es.onerror = () => {
      statusDot.className = 'dot off';
      statusText.textContent = 'desconectado';
      setTimeout(connectSSE, 3000);
    };
    es.onopen = () => {
      statusDot.className = 'dot on';
      statusText.textContent = 'conectado';
    };
  }
  connectSSE();

  // poll state every 2s as fallback
  setInterval(async () => {
    try {
      const r = await fetch('/dashboard/state');
      const d = await r.json();
      if (d.lights) {
        for (const [name, info] of Object.entries(d.lights)) {
          updateLight(name, info.color, info.brightness);
        }
      }
      if (d.mode) setMode(d.mode);
    } catch {}
  }, 2000);
</script>
</body>
</html>
